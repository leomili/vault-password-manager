{% extends "base.html" %} {% block content %}

<h2>{{ entry.website }}</h2>

{% if error %}
<p>{{ error }}</p>
{% else %}
<p><strong>Username:</strong> {{ entry.username }}</p>

<p>
  <strong>Password:</strong>
  <span id="password" style="display: none">{{ password }}</span>
  <button
    onclick="document.getElementById('password').style.display = 'inline'"
  >
    Reveal
  </button>
</p>
{% endif %}

<br />
<a href="{% url 'dashboard' %}">Back to dashboard</a>

{% endblock %}
