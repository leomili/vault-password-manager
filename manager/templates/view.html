{% extends "base.html" %}
{% block title %}{{ entry.website }}{% endblock %}
{% block content %}

<div class="page">

    {% if error %}
        <h1 class="page-title left">Error</h1>
        <p class="error-msg">{{ error }}</p>
    {% else %}
        <h1 class="page-title left">{{ entry.website }}</h1>

        <div class="view-field">
            <label>Username:</label>
            <div class="input-black">{{ entry.username }}</div>
        </div>

        <div class="view-field">
            <label>Password:</label>
            <div class="password-wrapper">
                <input class="input-black" type="password" id="pwd" value="{{ password }}" readonly />
                <button class="reveal-btn" onclick="togglePassword()" title="Reveal">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <form method="POST" action="{% url 'delete' entry.id %}">
            {% csrf_token %}
            <button class="btn btn-red" type="submit" onclick="return confirm('Are you sure you want to delete this entry?')">
                Delete
            </button>
        </form>

    {% endif %}

    <a class="btn btn-red" href="{% url 'dashboard' %}" style="margin-top: 16px; display: inline-block;">Back to dashboard</a>

</div>

<script>
function togglePassword() {
    const f = document.getElementById('pwd');
    f.type = f.type === 'password' ? 'text' : 'password';
}
</script>

{% endblock %}
