{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="page">

    <h1 class="page-title">Register</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Username:</label>
            <input class="input-gray" type="text" name="username" placeholder="yourusername" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Master password:</label>
            <input class="input-gray" type="password" name="master_password" placeholder="Yourmasterpassword123" autocomplete="off" />
        </div>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <button class="btn btn-red" type="submit" style="margin-top: 24px;">Register</button>
    </form>

    <a class="auth-link" href="{% url 'login' %}">Already have an account? Login here</a>

</div>

{% endblock %}
