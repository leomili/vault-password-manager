{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="page">

    <h1 class="page-title">Login</h1>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Username:</label>
            <input class="input-gray" type="text" name="username" maxlength="30" placeholder="yourusername" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Master password:</label>
            <input class="input-gray" type="password" name="master_password" maxlength="64" placeholder="Yourmasterpassword123" autocomplete="off" />
        </div>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <button class="btn btn-red" type="submit" style="margin-top: 24px;">Login</button>
    </form>

    <a class="auth-link" href="{% url 'register' %}">Don't have an account? Register here</a>

</div>

{% endblock %}
