{% extends "base.html" %}
{% block title %}Add Password{% endblock %}
{% block content %}

<div class="page">

    <h1 class="page-title">Add new password</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Website:</label>
            <input class="input-gray" type="text" name="website" placeholder="yourwebsitename" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input class="input-gray" type="text" name="username" placeholder="yourusername" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input class="input-gray" type="password" name="password" placeholder="Yourpassword123" autocomplete="off" />
        </div>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <div class="btn-stack">
            <button class="btn btn-red" type="submit">Save</button>
            <a class="btn btn-red" href="{% url 'dashboard' %}">Back to dashboard</a>
        </div>
    </form>

</div>

{% endblock %}
