{% extends "base.html" %}
{% block title %}Add Password{% endblock %}
{% block content %}

<div class="page">

    <h1 class="page-title">Add new password</h1>

    <form method="POST" action="{% url 'add' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Website:</label>
            <input class="input-gray" type="text" name="website" maxlength="20" placeholder="yourwebsitename" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input class="input-gray" type="text" name="username" maxlength="30" placeholder="yourusername" autocomplete="off" />
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input class="input-gray" type="password" name="password" id="password-field" maxlength="64" placeholder="Yourpassword123" autocomplete="off" />
        </div>

        <!-- Generator options -->
        <div class="form-group">
            <label>Length: <span id="length-display">16</span></label>
            <input type="range" id="length-slider" min="8" max="64" value="16" oninput="updateLength()" />
        </div>

        <div class="form-group">
            <label><input type="checkbox" id="opt-upper" checked /> Uppercase (A-Z)</label>
            <label><input type="checkbox" id="opt-numbers" checked /> Numbers (0-9)</label>
            <label><input type="checkbox" id="opt-symbols" checked /> Symbols (!@#$...)</label>
        </div>

        <button type="button" class="btn btn-red" onclick="generatePassword()" style="margin-bottom: 16px;">
            Generate password
        </button>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

        <div class="btn-stack">
            <button class="btn btn-red" type="submit">Save</button>
            <a class="btn btn-red" href="{% url 'dashboard' %}">Back to dashboard</a>
        </div>
    </form>

</div>

<script>
    function updateLength() {
        var slider = document.getElementById("length-slider");
        var display = document.getElementById("length-display");
        display.textContent = slider.value;
    }

    function generatePassword() {
        var chars = "abcdefghijklmnopqrstuvwxyz";
        if (document.getElementById("opt-upper").checked) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        if (document.getElementById("opt-numbers").checked) chars += "0123456789";
        if (document.getElementById("opt-symbols").checked) chars += "!@#$%^&*()-_=+[]{}|;:,.<>?";

        var length = document.getElementById("length-slider").value;
        var password = "";
        for (var i = 0; i < length; i++) {
            password += chars[Math.floor(Math.random() * chars.length)];
        }

        document.getElementById("password-field").value = password;
        document.getElementById("password-field").type = "text";
    }
</script>

{% endblock %}
